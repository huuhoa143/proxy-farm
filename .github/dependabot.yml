version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Electron majors need manual testing of the packaged app on both platforms.
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
